# Reusable ProtoRadar merge-request bot job for GitLab merge request pipelines.
# PROTORADAR_CLI_IMAGE is required and must point to an image with protoradar on PATH.

variables:
  PROTORADAR_PROTO_PATH: "."
  PROTORADAR_AGAINST: "latest"
  PROTORADAR_REPORT_FILE: "protoradar-mr-report.md"

protoradar:mr-check:
  image: "$PROTORADAR_CLI_IMAGE"
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - |
      set -eu
      if [ -z "${PROTORADAR_SERVER_URL:-}" ]; then
        echo "PROTORADAR_SERVER_URL is required" >&2
        exit 2
      fi
      if [ -z "${PROTORADAR_TOKEN:-}" ]; then
        echo "PROTORADAR_TOKEN is required. Configure it as a masked GitLab CI/CD variable." >&2
        exit 2
      fi
      if [ -z "${PROTORADAR_MODULE:-}" ]; then
        echo "PROTORADAR_MODULE is required" >&2
        exit 2
      fi
      if [ -z "${PROTORADAR_CLI_IMAGE:-}" ]; then
        echo "PROTORADAR_CLI_IMAGE is required and must contain the protoradar CLI" >&2
        exit 2
      fi
      if [ -z "${PROTORADAR_GITLAB_TOKEN:-}" ] && [ -z "${GITLAB_TOKEN:-}" ]; then
        echo "PROTORADAR_GITLAB_TOKEN or GITLAB_TOKEN is required. Configure it as a masked GitLab CI/CD variable." >&2
        exit 2
      fi
      if [ -z "${CI_SERVER_URL:-}" ] || [ -z "${CI_PROJECT_ID:-}" ] || [ -z "${CI_MERGE_REQUEST_IID:-}" ] || [ -z "${CI_COMMIT_SHA:-}" ]; then
        echo "CI_SERVER_URL, CI_PROJECT_ID, CI_MERGE_REQUEST_IID, and CI_COMMIT_SHA are required" >&2
        exit 2
      fi
      protoradar version
  script:
    - |
      set -eu
      protoradar gitlab mr-check \
        --module "${PROTORADAR_MODULE}" \
        --path "${PROTORADAR_PROTO_PATH:-.}" \
        --against "${PROTORADAR_AGAINST:-latest}" \
        --gitlab-base-url "${CI_SERVER_URL}" \
        --project-id "${CI_PROJECT_ID}" \
        --merge-request-iid "${CI_MERGE_REQUEST_IID}" \
        --commit-sha "${CI_COMMIT_SHA}" \
        --target-ref "${CI_COMMIT_SHA}" \
        --status-target-url "${CI_JOB_URL:-}" \
        --report-file "${PROTORADAR_REPORT_FILE:-protoradar-mr-report.md}"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "$PROTORADAR_REPORT_FILE"
