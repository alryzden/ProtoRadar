# Reusable ProtoRadar breaking-change check for GitLab merge request pipelines.
# PROTORADAR_CLI_IMAGE is required and must point to an image with protoradar on PATH.

variables:
  PROTORADAR_PROTO_PATH: "."
  PROTORADAR_AGAINST: "latest"
  PROTORADAR_REPORT_FILE: "protoradar-breaking-report.txt"

.protoradar-breaking-check:
  image: "$PROTORADAR_CLI_IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - |
      set -eu
      if [ -z "${PROTORADAR_SERVER_URL:-}" ]; then
        echo "PROTORADAR_SERVER_URL is required" >&2
        exit 2
      fi
      if [ -z "${PROTORADAR_TOKEN:-}" ]; then
        echo "PROTORADAR_TOKEN is required. Configure it as a masked GitLab CI/CD variable." >&2
        exit 2
      fi
      if [ -z "${PROTORADAR_MODULE:-}" ]; then
        echo "PROTORADAR_MODULE is required" >&2
        exit 2
      fi
      if [ -z "${PROTORADAR_CLI_IMAGE:-}" ]; then
        echo "PROTORADAR_CLI_IMAGE is required and must contain the protoradar CLI" >&2
        exit 2
      fi
      protoradar version
  script:
    - |
      set -eu
      protoradar check-breaking "${PROTORADAR_MODULE}" \
        --path "${PROTORADAR_PROTO_PATH:-.}" \
        --against "${PROTORADAR_AGAINST:-latest}" \
        --target-ref "${CI_COMMIT_SHA:-local}" \
        --report-file "${PROTORADAR_REPORT_FILE:-protoradar-breaking-report.txt}"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "$PROTORADAR_REPORT_FILE"
